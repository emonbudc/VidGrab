name: Live analytics

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics-live
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Google auth
        run: npm install --no-save --prefix "$RUNNER_TEMP/analytics" google-auth-library@9

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing" >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Build live snapshot
        env:
          NODE_PATH: ${{ runner.temp }}/analytics/node_modules
        run: node scripts/analytics/realtime.cjs --service-account "$RUNNER_TEMP/firebase-service-account.json" --output "$RUNNER_TEMP/realtime.json"

      - name: Publish live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan analytics-live
          git rm -rf . >/dev/null
          cp "$RUNNER_TEMP/realtime.json" realtime.json
          git add realtime.json
          git commit -m "Update live analytics"
          git push --force origin HEAD:analytics-live
