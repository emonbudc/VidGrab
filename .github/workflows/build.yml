name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "versions/**"
      - "**.md"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release for this build
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/^appVersionName=//p' gradle.properties | head -1)
          code=$(sed -n 's/^appVersionCode=//p' gradle.properties | head -1)
          [ -n "$version" ] || { echo "::error::appVersionName is missing from gradle.properties"; exit 1; }
          [ -n "$code" ] || { echo "::error::appVersionCode is missing from gradle.properties"; exit 1; }
          IFS=. read -r major minor patch <<< "$version"
          expected=$((major * 1000000 + minor * 1000 + patch))
          [ "$code" = "$expected" ] || {
            echo "::error::appVersionCode $code does not match appVersionName $version (expected $expected)"
            exit 1
          }
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (versionCode $code)"

      - name: Check release tag
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.name }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.name }} already exists; the release will not be overwritten."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing; add the Firebase config before building"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null
          echo "Firebase config restored"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vidgrab.jks"

      - name: Build signed release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/vidgrab.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Verify signatures and collect APKs
        run: |
          dir=app/build/outputs/apk/release
          ls -la "$dir"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found in $ANDROID_HOME/build-tools"; exit 1; }
          mkdir -p dist
          version=${{ steps.version.outputs.name }}
          collect() {
            abi="$1"
            suffix="$2"
            src="$dir/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error::$src not found"; exit 1; }
            "$apksigner" verify --verbose "$src" >/dev/null || { echo "::error::$src signature verification failed"; exit 1; }
            out="VidGrab-v$version${suffix:+-$suffix}.apk"
            cp "$src" "dist/$out"
            (cd dist && sha256sum "$out" > "$out.sha256")
          }
          collect arm64-v8a arm64-v8a
          collect armeabi-v7a armeabi-v7a
          collect universal ""
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VidGrab-v${{ steps.version.outputs.name }}
          path: dist/*
          retention-days: 14

      - name: Compose release notes
        run: |
          version="${{ steps.version.outputs.name }}"
          if [ -f "versions/v$version.md" ]; then
            cp "versions/v$version.md" "$RUNNER_TEMP/notes.md"
          else
            prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD~1..HEAD"; fi
            {
              echo "This release contains the **arm64-v8a**, **armeabi-v7a**, and **universal** APKs."
              echo
              echo "## What's improved"
              echo
              git log --no-merges --pretty='- %s' "$range"
            } > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        if: steps.tag.outputs.exists == 'false' && (github.event_name == 'push' || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: VidGrab v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          make_latest: true
