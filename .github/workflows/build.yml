name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "versions/**"
      - "**.md"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing; add the Firebase config before building"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null
          echo "Firebase config restored"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vidgrab.jks"

      - name: Build signed release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/vidgrab.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Verify signatures and collect APKs
        run: |
          dir=app/build/outputs/apk/release
          ls -la "$dir"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found in $ANDROID_HOME/build-tools"; exit 1; }
          mkdir -p dist
          version=${{ github.run_number }}
          for abi in arm64-v8a armeabi-v7a universal; do
            src="$dir/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error::$src not found"; exit 1; }
            "$apksigner" verify --verbose "$src" >/dev/null || { echo "::error::$src signature verification failed"; exit 1; }
            if [ "$abi" = universal ]; then out="VidGrab-v1.0.$version.apk"
            else out="VidGrab-v1.0.$version-$abi.apk"; fi
            cp "$src" "dist/$out"
            (cd dist && sha256sum "$out" > "$out.sha256")
          done
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VidGrab-v1.0.${{ github.run_number }}
          path: dist/*
          retention-days: 14

      - name: Compose release notes
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD~1..HEAD"; fi
          {
            echo "## What's improved"
            echo
            git log --no-merges --pretty='- %s' "$range"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VidGrab v1.0.${{ github.run_number }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          make_latest: true
